[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "personal-kontur"
version = "0.1.0"
description = "Personal event and approval control plane for AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20,<4",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.26,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
kontur-api = "kontur.api:main"
kontur-bot = "kontur.telegram_bot:main"
kontur-worker = "kontur.worker:main"
kontur-night-report = "kontur.night_agent_adapter:main"
kontur-services = "kontur.service_manager:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kontur"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]
